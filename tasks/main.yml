---
# tasks/main.yml

- name: assert all vars are set
  assert: 
    that:
      - item is defined
      - item | length > 0
    quiet: true
  loop:
  - service_name
  - service_volume_name
  - supervision_volume_name
  - service_mount_path
  - supervision_mount_path
  - dlm_replicas
  - dlm_application_properties
  - dlm_version
  - aws_access_key
  - aws_secret_key

- name: Check if Docker is installed
  command: docker --version
  register: docker_installed
  ignore_errors: yes

- name: Fail if Docker is not installed
  fail:
    msg: "Docker is not installed on this host."
  when: docker_installed.failed

- name: Check if machine is Swarm Manager
  command: "docker info --format '{% raw %}{{.Swarm.ControlAvailable}}{% endraw %}'"
  register: swarm_status

- name: Fail if machine is not Swarm Manager
  fail:
    msg: "This is not a Docker Swarm Manager"
  when: swarm_status.stdout != "true"

- name: Success message
  debug:
    msg: "Docker is installed and is Docker Swarm Manager"
  when: swarm_status.stdout == "true"


## Required dependencies for ansible docker modules.
- name: Make sure pip is installed
  package:
    name: python3-pip
    state: present

- name: Install Docker SDK for Python
  pip:
    name: "{{ item }}"
    state: present
  with_items:
    - certifi==2020.6.20
    - requests==2.24.0
    - docker==4.3.1

- name: login to aws ecr
  shell: "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin {{awsecr_name}}"
  environment:
    AWS_ACCESS_KEY_ID: "{{ lookup('env','aws_access_key') }}"
    AWS_SECRET_ACCESS_KEY: "{{ lookup('env','aws_secret_key') }}"
  become: true

- name: Pull Device Lifecycle Manager image from ecr
  shell: docker pull {{ image_name }}
  become: true

- name: Make sure docker secrets for internet info exist
  command: "docker secret inspect maintenance.internet.authentication"
  ignore_errors: yes
  register: secret_internet_info

- name: Fail if Docker secret does not exist
  fail:
    msg: "Docker secret 'maintenance.internet.authentication' does not exist."
  when: secret_internet_info.rc != 0

- name: Make sure docker secrets for p12 password exist
  command: "docker secret inspect p12.password"
  ignore_errors: yes
  register: secret_p12_password

- name: Fail if Docker secret does not exist
  fail:
    msg: "Docker secret 'p12.password' does not exist."
  when: secret_p12_password.rc != 0

- name: Set JAVA_OPTS for OTEL
  set_fact:
    extra_java_options: >-
      {%- if otel_enabled | default(false) -%}
        -javaagent:{{ otel_jar_path }}
        -Dotel.service.name={{ otel_service_name }}
        -Dotel.resource.attributes={{ otel_resource_attributes }}
        -Dotel.exporter.otlp.endpoint={{ otel_exporter_endpoint }}
        -Dotel.exporter.otlp.protocol={{ otel_exporter_protocol }}
        -Dotel.logs.exporter={{ otel_logs_exporter }}
      {%- else -%}
      {%- endif -%}

- name: Build base service mounts
  set_fact:
    service_mounts:
      - type: volume
        source: "{{ service_volume_name }}"
        target: "{{ service_mount_path }}"
        driver_config:
          name: local
      - type: volume
        source: "{{ supervision_volume_name }}"
        target: "{{ supervision_mount_path }}"

- name: Append OTEL volume mount if otel_enabled
  set_fact:
    service_mounts: "{{ service_mounts + [{'type': 'volume', 'source': otel_volume_name, 'target': otel_mount_path}] }}"
  when: otel_enabled | default(false)

- name: Build base service networks
  set_fact:
    service_networks:
      - name: bridge

- name: Append monitoring network if otel_enabled
  set_fact:
    service_networks: "{{ service_networks + [{'name': 'monitoring'}] }}"
  when: otel_enabled | default(false)

- name: Ensure monitoring overlay network exists
  docker_network:
    name: monitoring
    driver: overlay
    attachable: true
    state: present
  when: otel_enabled | default(false)

- name: Deploy the Docker Swarm service
  docker_swarm_service:
    name: "{{ service_name }}"
    image: "{{ image_name }}"
    env:
      SPRING_APPLICATION_JSON: "{{ dlm_application_properties | to_json }}"
      JAVA_OPTS: "{{ extra_java_options | trim }}"
    mode: replicated
    replicas: "{{ dlm_replicas }}"
    force_update: true
    update_config:
      parallelism: 1
      delay: 10s
      failure_action: rollback
      monitor: 60s
      order: start-first
    networks: "{{ service_networks }}"
    mounts: "{{ service_mounts }}"
    secrets:
      - secret_name: "maintenance.internet.authentication"
        filename: "/tmp/internetInfo"
      - secret_name: "p12.password"
        filename: "{{ supervision_mount_path }}/p12_password"

- name: Gather info of Docker Swarm service
  docker_swarm_service_info:
    name: "{{ service_name }}"
  register: swarm_service_info_daas

- name: Debug swarm_service_info_daas
  debug:
    var: swarm_service_info_daas
